<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Student ID Card - ' + ${student.name}">Student ID Card</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background: white;
            }
            .main-wrapper {
                margin-left: 0;
            }
            .id-card-container {
                box-shadow: none;
                border: 2px solid #000;
                margin: 20px auto;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="no-print" th:replace="~{fragments :: sidebar('students')}"></div>

    <div class="main-wrapper">
        <header class="no-print" th:replace="~{fragments :: topHeader('Student Smart ID Card', 'Print or download official QR attendance card')}"></header>

        <div class="content-body">
            <div class="no-print" style="max-width: 480px; margin: 0 auto 20px; display: flex; justify-content: space-between;">
                <a th:href="@{/students}" class="btn btn-outline-brown btn-sm">&larr; Back to Students</a>
                <div style="display: flex; gap: 8px;">
                    <a th:href="@{'/students/' + ${student.id} + '/qr-download'}" class="btn btn-golden btn-sm">
                        <span>📥</span> Download QR PNG
                    </a>
                    <button onclick="window.print()" class="btn btn-brown btn-sm">
                        <span>🖨</span> Print Card
                    </button>
                </div>
            </div>

            <!-- SMART ID CARD -->
            <div class="id-card-container">
                <div class="id-card-header">
                    <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--golden); font-weight: 700;">
                        COLLEGE OF ENGINEERING & TECHNOLOGY
                    </div>
                    <div style="font-size: 16px; font-weight: 700; margin-top: 3px;">STUDENT IDENTITY CARD</div>
                </div>

                <div class="id-card-body">
                    <!-- QR Code Frame -->
                    <div class="id-qr-frame">
                        <img th:src="${qrCodeBase64}" alt="Student Attendance QR Code" width="180" height="180" style="display: block;" />
                    </div>

                    <div style="font-size: 18px; font-weight: 700; color: var(--primary-brown); margin-top: 8px;"
                         th:text="${student.name}">Amandeep Singh</div>

                    <div style="font-size: 13px; color: var(--golden-hover); font-weight: 700; letter-spacing: 0.5px; margin-bottom: 14px;"
                         th:text="'ID: ' + ${student.studentId}">ID: STU001</div>

                    <table style="width: 100%; font-size: 13px; text-align: left; border-top: 1px solid var(--beige-dark); padding-top: 12px;">
                        <tr>
                            <td style="color: var(--text-muted); padding: 4px 0;">Roll No:</td>
                            <td><strong th:text="${student.rollNo}">101</strong></td>
                        </tr>
                        <tr>
                            <td style="color: var(--text-muted); padding: 4px 0;">Class & Div:</td>
                            <td><strong th:text="${student.className + ' - ' + student.division}">CSE - A</strong></td>
                        </tr>
                        <tr>
                            <td style="color: var(--text-muted); padding: 4px 0;">Student Email:</td>
                            <td style="font-size: 11px;" th:text="${student.studentEmail}">student@gmail.com</td>
                        </tr>
                        <tr>
                            <td style="color: var(--text-muted); padding: 4px 0;">Parent Contact:</td>
                            <td style="font-size: 11px;" th:text="${student.parentName}">Gurdeep Singh</td>
                        </tr>
                    </table>

                    <div style="margin-top: 18px; padding-top: 10px; border-top: 1px dashed var(--beige-dark); font-size: 11px; color: var(--text-muted);">
                        ⚡ Scan this QR Code at the classroom door to mark instant attendance.
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
