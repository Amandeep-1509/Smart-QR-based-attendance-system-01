# ===================================================================
# SMART QR-BASED ATTENDANCE & PARENT NOTIFICATION SYSTEM
# Spring Boot Configuration File
# ===================================================================

# Application Server Port
server.port=8080

# -------------------------------------------------------------------
# 1. DATABASE CONFIGURATION (MySQL)
# -------------------------------------------------------------------
# Default MySQL configuration for local XAMPP / MySQL Workbench.
# If MySQL is running on port 3306, the app automatically connects to MySQL.
# If MySQL is offline, the app safely falls back to local storage without crashing.
spring.datasource.mysql.url=jdbc:mysql://localhost:3306/smart_attendance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.mysql.username=${DB_USERNAME:root}
spring.datasource.mysql.password=${DB_PASSWORD:root}

# Force database mode: 'auto' (detects MySQL or falls back), 'mysql', or 'h2'
app.database.force-mode=auto

# JPA / Hibernate auto table creation and updates
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# 2. EMAIL CONFIGURATION (Spring Mail & Gmail SMTP)
# -------------------------------------------------------------------
# For security, credentials use environment variables (${MAIL_USERNAME}, ${MAIL_PASSWORD}).
# When these credentials are not set, the system automatically runs in DEMO MODE
# so you can safely test the project and see simulated email previews without crashing!
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:amandeep.cse.armiet@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email Mode: 'auto' (activates DEMO MODE if credentials empty) or 'true' (force demo)
app.email.demo-mode=auto
app.email.sender-name=${MAIL_SENDER_NAME:Smart QR Based Attendance System}

# -------------------------------------------------------------------
# 3. THYMELEAF CONFIGURATION
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
